name: Build & Push

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ env.VERSION }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Bump image tag in chart/values.yaml
        run: |
          sed -i "s/^  tag: .*/  tag: \"${{ env.VERSION }}\"/" chart/values.yaml
          sed -i "s/^  pullPolicy: .*/  pullPolicy: IfNotPresent/" chart/values.yaml
          sed -i "s|^  repository: .*|  repository: ghcr.io/${{ github.repository }}|" chart/values.yaml

      - name: Commit bump
        run: |
          git config user.email "ci@github.com"
          git config user.name "GitHub Actions"
          git add chart/values.yaml
          git diff --staged --quiet || git commit -m "chore: bump image to ${{ env.VERSION }} [skip ci]"
          git push origin HEAD:main
