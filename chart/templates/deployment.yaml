apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "atomicwatch.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "atomicwatch.labels" . | nindent 4 }}
  annotations:
    team/owner: ops
    docs/runbook: "https://github.com/{{ .Values.image.repository | splitList "/" | first }}/atomicwatch"
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "atomicwatch.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "atomicwatch.labels" . | nindent 8 }}
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: {{ include "atomicwatch.fullname" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 8
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.security.runAsUser }}
        runAsGroup: {{ .Values.security.runAsGroup }}
        fsGroup: {{ .Values.security.runAsGroup }}
        supplementalGroups: {{ toJson .Values.security.supplementalGroups }}
        seccompProfile:
          type: RuntimeDefault

      # ── Init container: download GeoIP databases ───────────────────────────
      initContainers:
        - name: geoip-downloader
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python3", "/app/exporters/geoip_download.py"]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: GEOIP_DIR
              value: /geoip
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: geoip-data
              mountPath: /geoip
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

      containers:
        # ── Main application ─────────────────────────────────────────────────
        - name: atomicwatch
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: GEOIP_CITY_DB
              value: /geoip/dbip-city-lite.mmdb
            - name: GEOIP_ASN_DB
              value: /geoip/dbip-asn-lite.mmdb
            - name: FAIL2BAN_LOG
              value: /host/fail2ban.log
            - name: SSH_JOURNAL_FILE
              value: /shared/ssh-journal.jsonl
            - name: FIREWALL_LOG
              value: /shared/firewall-drops.jsonl
            - name: COWRIE_LOG
              value: /host/cowrie
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_RAW"]
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: fail2ban-log
              mountPath: /host/fail2ban.log
              readOnly: true
            - name: cowrie-log
              mountPath: /host/cowrie
              readOnly: true
            - name: geoip-data
              mountPath: /geoip
              readOnly: true
            - name: shared-data
              mountPath: /shared
              readOnly: true
            - name: tmp
              mountPath: /tmp

        # ── Sidecar: SSH journal exporter ────────────────────────────────────
        - name: ssh-journal-exporter
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python3", "/app/exporters/ssh_journal_export.py"]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: SSH_EXPORT_FILE
              value: /shared/ssh-journal.jsonl
            - name: JOURNAL_DIR
              value: /var/log/journal
            - name: SSH_EXPORT_INTERVAL
              value: "120"
            - name: SSH_EXPORT_SINCE
              value: "7 days ago"
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: journal-dir
              mountPath: /var/log/journal
              readOnly: true
            - name: machine-id
              mountPath: /etc/machine-id
              readOnly: true
            - name: shared-data
              mountPath: /shared
            - name: tmp
              mountPath: /tmp

        # ── Sidecar: Firewall drops exporter ─────────────────────────────────
        - name: firewall-exporter
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python3", "/app/exporters/firewall_export.py"]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: FW_EXPORT_FILE
              value: /shared/firewall-drops.jsonl
            - name: JOURNAL_DIR
              value: /var/log/journal
            - name: FW_EXPORT_INTERVAL
              value: "30"
            - name: FW_EXPORT_SINCE
              value: "30 days ago"
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: journal-dir
              mountPath: /var/log/journal
              readOnly: true
            - name: machine-id
              mountPath: /etc/machine-id
              readOnly: true
            - name: shared-data
              mountPath: /shared
            - name: tmp
              mountPath: /tmp

      volumes:
        # ── Host log sources (read-only, generated by external services) ──────
        - name: fail2ban-log
          hostPath:
            path: {{ .Values.hostLogs.fail2banLog }}
            type: File
        - name: cowrie-log
          hostPath:
            path: {{ .Values.hostLogs.cowrieDir }}
            type: Directory
        # ── Journal access for sidecar exporters ──────────────────────────────
        - name: journal-dir
          hostPath:
            path: /var/log/journal
            type: Directory
        - name: machine-id
          hostPath:
            path: /etc/machine-id
            type: File
        # ── Shared emptyDir: produced by sidecars, consumed by main container ─
        - name: shared-data
          emptyDir: {}
        # ── GeoIP databases: populated by init container ───────────────────────
        - name: geoip-data
          emptyDir: {}
        # ── Writable /tmp for all containers ──────────────────────────────────
        - name: tmp
          emptyDir: {}
