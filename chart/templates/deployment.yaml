apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "atomicwatch.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "atomicwatch.labels" . | nindent 4 }}
  annotations:
    team/owner: ops
    docs/runbook: "https://github.com/{{ .Values.image.repository | splitList "/" | first }}/atomicwatch"
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "atomicwatch.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "atomicwatch.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "atomicwatch.fullname" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 8
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.security.runAsUser }}
        runAsGroup: {{ .Values.security.runAsGroup }}
        fsGroup: {{ .Values.security.runAsGroup }}
        supplementalGroups: {{ toJson .Values.security.supplementalGroups }}
        seccompProfile:
          type: RuntimeDefault
      {{- if .Values.image.pullSecret }}
      imagePullSecrets:
        - name: {{ .Values.image.pullSecret }}
      {{- end }}

      # ── Init container: download GeoIP databases ───────────────────────────
      initContainers:
        - name: geoip-downloader
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python3", "/app/exporters/geoip_download.py"]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: GEOIP_DIR
              value: /geoip
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: geoip-data
              mountPath: /geoip
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

      containers:
        # ── Main application ─────────────────────────────────────────────────
        - name: atomicwatch
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: GEOIP_CITY_DB
              value: /geoip/dbip-city-lite.mmdb
            - name: GEOIP_ASN_DB
              value: /geoip/dbip-asn-lite.mmdb
            - name: FAIL2BAN_LOG
              value: /host-data/fail2ban.log
            - name: SSH_JOURNAL_FILE
              value: /host-data/ssh-journal.jsonl
            - name: FIREWALL_LOG
              value: /host-data/firewall-drops.jsonl
            - name: COWRIE_LOG
              value: /host-data/cowrie
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_RAW"]
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: host-data
              mountPath: /host-data
              readOnly: true
            - name: geoip-data
              mountPath: /geoip
              readOnly: true
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: host-data
          persistentVolumeClaim:
            claimName: atomicwatch-hostlogs
        - name: geoip-data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
