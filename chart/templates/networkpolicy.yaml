apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "atomicwatch.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "atomicwatch.labels" . | nindent 4 }}
  annotations:
    purpose: "Ingress Traefik sur 8000 uniquement. Egress non restreint (ICMP traceroute + RIPEstat + GeoIP)."
spec:
  podSelector:
    matchLabels:
      {{- include "atomicwatch.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 8000
          protocol: TCP

