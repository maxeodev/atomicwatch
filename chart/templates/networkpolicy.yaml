apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "atomicwatch.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "atomicwatch.labels" . | nindent 4 }}
  annotations:
    purpose: "Ingress Traefik sur 8000. Egress DNS + HTTPS pour GeoIP download."
spec:
  podSelector:
    matchLabels:
      {{- include "atomicwatch.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 8000
          protocol: TCP
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        - port: 443
          protocol: TCP
