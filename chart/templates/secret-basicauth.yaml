{{- if and .Values.basicAuth.enabled .Values.basicAuth.secret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "atomicwatch.fullname" . }}-basicauth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "atomicwatch.labels" . | nindent 4 }}
type: Opaque
data:
  users: {{ .Values.basicAuth.secret | quote }}
{{- end }}
{{- /*
  Secret normalement géré par SealedSecret (templates/sealed-basicauth.yaml).
  Ce template n'est actif que si basicAuth.secret est renseigné dans values.yaml,
  ce qui ne doit pas arriver en production GitOps.
*/ -}}
