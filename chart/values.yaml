image:
  repository: ghcr.io/maxeodev/atomicwatch
  tag: "0.2.12"
  pullPolicy: IfNotPresent
  pullSecret: ghcr-pull-secret

replicaCount: 1

security:
  runAsUser: 1001
  runAsGroup: 1001
  supplementalGroups:
    - 4

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: true
  className: traefik
  host: atomicwatch.51.83.100.146.nip.io
  tls: true
  clusterIssuer: letsencrypt-production

basicAuth:
  enabled: true
  # Secret managed via SealedSecret — ne pas mettre la valeur ici
  # Générer avec : kubectl create secret ... | kubeseal > secrets/sealed-basicauth.yaml

geoip:
  cityDb: dbip-city-lite.mmdb
  asnDb: dbip-asn-lite.mmdb

nfs:
  server: 192.168.200.1
  path: /opt/atomicwatch

probes:
  liveness:
    initialDelaySeconds: 30
    periodSeconds: 60
    timeoutSeconds: 10
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
